/* Marownie — unified heading and menu colors */

:root {
  --burgundy: #713c49;
  --cream: #f8f5ef;
  --paper: #fffdf9;
  --muted: #817773;
}

body {
  background-color: var(--cream);
}

nav a,
.hero h1,
.section-heading h2,
.story h2,
.order h2,
.treat h3,
.footer-brand,
.explore {
  color: #713c49;
}
