      --pink: #c58c99;
      --ink: #39312f;
      --muted: #817773;
      --line: #e9e0d9;

    }

    html {
      scroll-behavior: smooth;
    }

    body {

    a {

      text-decoration: none;
    }

    header {

      text-align: center;
      background: var(--paper);
    }

    .logo img {
      display: block;
      width: min(320px, 82%);
      max-height: 170px;
      object-fit: contain;
      margin: 0 auto 18px;
    }

    .back-link {
      display: inline-block;
      color: var(--burgundy);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .04em;
    }

    .back-link:hover {
      color: var(--pink);

      font-size: 15px;

    }

    .intro {

      color: var(--muted);
      font-size: 14px;

    }

    }
